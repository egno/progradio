name: ProgRadio
options:
  bundleIdPrefix: io.github.egno
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  ProgRadio:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Prog Radio Menu Bar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.music
        CFBundleURLTypes:
          - CFBundleURLName: io.github.egno.ProgRadio
            CFBundleURLSchemes: [progradio]
    entitlements:
      path: App/ProgRadio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.egno.ProgRadio
        # The .app and executable carry the display name; the Swift module keeps the short one.
        PRODUCT_NAME: Prog Radio Menu Bar
        PRODUCT_MODULE_NAME: ProgRadio
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ProgRadioWidgets
        embed: true
  ProgRadioWidgets:
    type: app-extension
    platform: macOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Prog Radio Menu Bar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/ProgRadioWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.egno.ProgRadio.Widgets
        GENERATE_INFOPLIST_FILE: NO
  ProgRadioTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests, Shared]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.egno.ProgRadioTests
schemes:
  ProgRadio:
    build:
      targets:
        ProgRadio: all
    test:
      targets: [ProgRadioTests]
