name: ProgRadio
options:
  bundleIdPrefix: local.progradio
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  ProgRadio:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Prog Radio
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.music
        CFBundleURLTypes:
          - CFBundleURLName: local.progradio.ProgRadio
            CFBundleURLSchemes: [progradio]
    entitlements:
      path: App/ProgRadio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.progradio.ProgRadio
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ProgRadioWidgets
        embed: true
  ProgRadioWidgets:
    type: app-extension
    platform: macOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Prog Radio
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/ProgRadioWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.progradio.ProgRadio.Widgets
        GENERATE_INFOPLIST_FILE: NO
  ProgRadioTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests, Shared]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.progradio.ProgRadioTests
schemes:
  ProgRadio:
    build:
      targets:
        ProgRadio: all
    test:
      targets: [ProgRadioTests]
